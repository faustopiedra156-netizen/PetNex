{% extends 'base.html' %}

{% block title %}Pago con Tarjeta - PetCare Loja{% endblock %}

{% block content %}
<div class="py-12 max-w-3xl mx-auto px-4 sm:px-6">
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-xl">
        <div class="mb-6">
            <h1 class="font-headline font-black text-2xl text-slate-900">Pago seguro con tarjeta</h1>
            <p class="text-sm text-slate-500 mt-1">Procesado por Datafast. Total: <b>${{ cita.servicio.precio }}</b></p>
        </div>

        <script src="{{ datafast_base_url }}/v1/paymentWidgets.js?checkoutId={{ cita.datafast_checkout_id }}"></script>
        <form action="{% url 'datafast_result' cita.id %}" class="paymentWidgets" data-brands="{{ datafast_brands }}"></form>
    </div>
</div>
{% endblock %}
